[[exercises]]
name = "http/chunked"
path = "exercises/07_http/03_chunked.rs"
hint = "分块传输编码允许发送未知长度的响应"

[[exercises]]
name = "websocket/frame"
path = "exercises/08_websocket/00_frame.rs"
