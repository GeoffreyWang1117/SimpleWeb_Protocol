[[exercises]]
name = "http/request"
path = "exercises/07_http/00_request.rs"
hint = "HTTP请求格式: 方法 路径 版本\\r\\n头部\\r\\n\\r\\n正文"

[[exercises]]
name = "http/response"
path = "exercises/07_http/01_response.rs"
hint = "HTTP响应格式: 版本 状态码 原因\\r\\n头部\\r\\n\\r\\n正文"

[[exercises]]
name = "http/client"
path = "exercises/07_http/02_client.rs"
